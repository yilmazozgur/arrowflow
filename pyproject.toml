[tool.poetry]
name = "arrowflow"
version = "0.1.0"
description = "ArrowFlow: networks of ranking layers trained with position votes"
authors = ["Ozgur Yilmaz <ozguryilmaz@atu.edu.tr>"]
readme = "README.md"
license = "MIT"

[tool.poetry.dependencies]
python = "^3.11"
numpy = "^1.26"
scipy = "^1.12"
scikit-learn = "^1.4"
pandas = "^2.2"
joblib = "^1.4"
threadpoolctl = "^3.5"
torch = "^2.2"
torchvision = {version = "^0.17", optional = true}
matplotlib = "^3.8"

[tool.poetry.extras]
mnist = ["torchvision"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
